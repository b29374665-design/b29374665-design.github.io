name: Build résumé PDFs

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Print the PDFs
        run: node .github/scripts/make-pdf.mjs
      - name: Commit the PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume-zh.pdf resume-en.pdf resume-rd-zh.pdf resume-rd-en.pdf
          git diff --cached --quiet || { git commit -m "Regenerate résumé PDFs"; git push; }
